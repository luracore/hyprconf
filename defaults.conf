# Programas padrão do hyprconf: nome = comando.
# Usados pelos atalhos do Hyprland e pelo app Configurações.
# Vale na hora: não precisa recarregar nada depois de salvar.

# terminal (SUPER + RETURN)
terminal = foot

# explorador de arquivos (SUPER + E)
files = thunar

# editor de texto; um editor de terminal precisa abrir dentro de um
# (ex.: "foot -e nvim"); um gráfico vai direto (ex.: "gedit")
editor = foot -e nvim

# navegador
browser = firefox
