# Programas padrão do hyprconf: nome = comando.
# Quem abre é o apps/hyprrunner (ex.: "hyprrunner terminal -e htop"), usado
# pelos atalhos do Hyprland, pelo lançador, pelo HyprSettings e pelo RepoStore.
# Vale na hora: não precisa recarregar nada depois de salvar.
#
# Trocou o terminal? Ajuste também "editor" e "repostore", que abrem nele.

# terminal (SUPER + RETURN); precisa aceitar "-e comando" (foot, alacritty,
# kitty, ghostty e a maioria aceitam)
terminal = foot

# explorador de arquivos (SUPER + E)
files = thunar

# editor de texto; um editor de terminal precisa abrir dentro de um
# (ex.: "foot -e nvim"); um gráfico vai direto (ex.: "gedit")
editor = foot -e nvim

# navegador (SUPER + B)
browser = firefox

# RepoStore (instalar e remover pacotes), num terminal com o app-id/class
# "repostore": é por ele que a janela abre flutuante e centralizada
# (hypr/config/window-rules.lua). O "alpha=1" deixa a janela opaca.
# Em outros terminais:
#   alacritty --class repostore --title RepoStore -e ~/hyprconf/apps/repostore/repostore
#   kitty --class repostore --title RepoStore ~/hyprconf/apps/repostore/repostore
repostore = foot --app-id=repostore --title=RepoStore -o colors-dark.alpha=1 ~/hyprconf/apps/repostore/repostore
