# Configuração do makepkg só para este usuário (lida depois de
# /etc/makepkg.conf). Ligado em ~/.config/pacman/makepkg.conf pelo install.sh.

# Não gerar pacotes *-debug ao compilar (AUR via yay, metapacotes): eles só
# servem para depurar travamentos e acabam virando órfãos.
# O makepkg considera a última ocorrência da opção, então basta acrescentar.
OPTIONS+=(!debug)
