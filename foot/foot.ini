[main]
font=FiraCode Nerd Font Mono:size=12
dpi-aware=yes

# Tema ativo: current.ini (fora do git), um arquivo ao lado deste. O hyprconf
# escreve nele o tema do sistema; sem o hyprconf, use o que vem pronto:
#   ln -s tokyonight.ini ~/.config/foot/current.ini
include=~/.config/foot/current.ini

[colors-dark]
alpha=0.85
