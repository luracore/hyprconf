[bar]
background-opacity = 0

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "separator",
    "hyprland-workspaces",
    "separator",
    "media",
    "cava",
]
center = ["clock"]
right = [
    "systray",
    "volume",
    "separator",
    "bluetooth",
    "network",
    "separator",
    "battery",
    "notifications",
]

[styling.palette]
bg = "#1a1a22"
surface = "#1f1f28"
elevated = "#2a2a37"
fg = "#dcd7ba"
fg-muted = "#727169"
primary = "#ff7800"
red = "#e01b24"
yellow = "#dca561"
green = "#33d17a"
blue = "#3584e4"

[modules.bluetooth]
label-show = false

[modules.cava]
bars = 30
color = "green"
border-show = true
border-color = "green"

[modules.clock]
format = "%a %d %H:%M"

[modules.dashboard]
border-color = "blue"
icon-bg-color = "blue"
dropdown-logout-command = "hyprctl dispatch 'hl.dsp.exit()'"

[modules.hyprland-workspaces]
show-special = false

[modules.media]
border-color = "green"
icon-bg-color = "green"
label-show = false
label-color = "green"

[modules.network]
label-show = false

[modules.notifications]
label-show = false

[modules.power]
left-click = "systemctl poweroff"

[modules.separator]
color = "accent-hover"

[modules.systray]
border-show = true
border-color = "blue"
