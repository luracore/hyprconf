# cores de reserva, caso o hyprlock-current.conf (gerado pelo
# themes/converters/hyprlock) ainda não exista
$background = rgb(1e1e1e)
$surface = rgb(2e2e2e)
$text = rgb(e0e0e0)
$muted = rgb(8a8a8a)
$primary = rgb(7aa2f7)
$success = rgb(9ece6a)
$warning = rgb(e0af68)
$error = rgb(f7768e)

source = ~/.config/hypr/hyprlock-current.conf

# a mesma fonte da barra
$font = FiraCode Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $HOME/hyprconf/wallpapers/current
    color = $background
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font

    position = 0, -140
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $primary
    font_size = 22
    font_family = $font

    position = 0, -280
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12

    inner_color = $surface
    outer_color = $primary
    check_color = $success
    fail_color = $error
    capslock_color = $warning
    font_color = $text

    font_family = $font
    placeholder_text = <i>Senha</i>
    check_text = Conferindo…
    fail_text = Senha incorreta
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}
