# Config do cava usada pelo módulo Cava.qml da barra.
# Saída "raw" em texto: uma linha por frame, valores 0-100 separados por ";".
# O número de barras desenhadas na barra segue o "bars" daqui.

[general]
framerate = 60
bars = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
